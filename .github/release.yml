# GitHub 自动生成发行说明的分类配置。
# 文档: https://docs.github.com/zh/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - github-actions
  categories:
    - title: 新增
      labels:
        - enhancement
        - feature
    - title: 修复
      labels:
        - bug
        - fix
    - title: 其他变更
      labels:
        - "*"
