[package]
name = "r-json"
version = "0.2.2"
description = "Local JSON Crack-style visualizer built with Rust and Tauri 2"
authors = ["r-json"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-fs = "2.7.0"
serde_yaml = "0.9.34"
quick-xml = "0.42.0"
csv = "1.4.0"
jaq-std = "3.0.3"
rayon = "1.12.0"
toml = "1.1.8"
jaq-core = "3.1.1"
jaq-json = { version = "2.0.3", features = ["serde"] }
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
